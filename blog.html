<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Блог и ревюта — SENTIVA Beauty Bar</title>
<meta name="description" content="Ревюта на козметика за коса, парфюми и грим, съвети за избор на аромат и новини от SENTIVA Beauty Bar, Ботевград.">
<link rel="icon" href="img/logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="blog">

<main class="wrap page">
  <div id="listView">
    <div class="sec-head">
      <p class="eyebrow">Блог</p>
      <h1 class="page-title">Ревюта, съвети и новини</h1>
      <p class="muted lead-sm">Разказваме за продуктите, които обичаме, и как да ги използвате най-добре.</p>
    </div>
    <div class="chips" id="kinds"></div>
    <div class="post-grid" id="posts"></div>
  </div>

  <article class="post" id="postView" hidden>
    <a href="#" class="back" id="back">← Всички статии</a>
    <p class="eyebrow" id="pKind"></p>
    <h1 class="page-title" id="pTitle"></h1>
    <p class="muted" id="pDate"></p>
    <img id="pImg" alt="">
    <div class="post-content" id="pBody"></div>
    <div id="pProducts"></div>
  </article>

  <section class="reviews" id="reviews">
    <div class="sec-head">
      <p class="eyebrow">Отзиви</p>
      <h2>Какво казват клиентите ни</h2>
    </div>
    <div class="review-grid" id="reviewList"></div>

    <form class="review-form" id="reviewForm" name="review" method="POST" data-netlify="true" netlify-honeypot="bot-field" novalidate>
      <h3>Оставете отзив</h3>
      <input type="hidden" name="form-name" value="review">
      <p hidden><label>Не попълвайте: <input name="bot-field"></label></p>
      <fieldset class="stars" aria-label="Оценка">
        <legend class="sr">Оценка</legend>
        <input type="radio" name="rating" id="r5" value="5" checked><label for="r5" title="5">★</label>
        <input type="radio" name="rating" id="r4" value="4"><label for="r4" title="4">★</label>
        <input type="radio" name="rating" id="r3" value="3"><label for="r3" title="3">★</label>
        <input type="radio" name="rating" id="r2" value="2"><label for="r2" title="2">★</label>
        <input type="radio" name="rating" id="r1" value="1"><label for="r1" title="1">★</label>
      </fieldset>
      <div class="f-row">
        <label>Име *<input name="name" required></label>
        <label><span>Продукт <span class="muted">(по избор)</span></span><input name="product" list="productNames"></label>
      </div>
      <datalist id="productNames"></datalist>
      <label>Вашият отзив *<textarea name="text" rows="4" required></textarea></label>
      <label class="consent"><input type="checkbox" name="publish" value="да" required> Съгласен/на съм отзивът ми да бъде публикуван на сайта с малкото ми име. *</label>
      <p class="form-error" id="reviewError" role="alert" hidden></p>
      <button class="btn btn-gold" type="submit">Изпрати отзива</button>
      <p class="muted small">Отзивите се публикуват след преглед.</p>
    </form>
  </section>
</main>

<script src="products.js"></script>
<script src="blog-data.js"></script>
<script src="layout.js"></script>
<script src="blog.js"></script>
</body>
</html>
